server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

ingester:
  max_block_bytes: 5000000 # Defaults to 5MB.
  max_block_duration: 5m # Defaults to 5m.

compactor:
  compaction:
    compaction_window: 1h
    max_block_bytes: 100000000 # Defaults to 100MB.
    block_retention: 24h # Defaults to 24h.

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
